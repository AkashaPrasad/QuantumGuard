services:
  quantumguard:
    image: quantumguard:local
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QG_DATA_DIR: /var/lib/quantumguard/data
      QG_KEYS_DIR: /var/lib/quantumguard/keys
      QG_PORT: "8080"
      QG_WEB_DIST: /app/web/dist
      QG_DEMO: ${QG_DEMO:-0}
    volumes:
      - data:/var/lib/quantumguard/data
      - keys:/var/lib/quantumguard/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 128
    stop_grace_period: 20s
    restart: unless-stopped

  tests:
    profiles: [test]
    image: quantumguard-tests:local
    pull_policy: build
    build:
      context: .
      target: test
    environment:
      QG_DATA_DIR: /tmp/qg/data
      QG_KEYS_DIR: /tmp/qg/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    pids_limit: 256
    # Keep reports writable while source, app volumes and host sockets stay absent.
    volumes:
      - test-results:/results
    working_dir: /app
    network_mode: none

  caddy:
    profiles: [tls]
    image: ${QG_CADDY_IMAGE:-docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    user: "10001:10001"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      quantumguard:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /config:rw,noexec,nosuid,size=4m,uid=10001,gid=10001

volumes:
  data:
  keys:
  test-results:
