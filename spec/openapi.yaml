components:
  schemas:
    Ack:
      additionalProperties: false
      properties:
        note:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Note
      title: Ack
      type: object
    Approve:
      additionalProperties: false
      properties:
        signature:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Signature
          type: string
      required:
      - signature
      title: Approve
      type: object
    ChangeCreate:
      additionalProperties: false
      properties:
        change:
          $ref: '#/components/schemas/ChangeStatement'
        signature:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Signature
          type: string
      required:
      - change
      - signature
      title: ChangeCreate
      type: object
    ChangeStatement:
      additionalProperties: false
      properties:
        directory_epoch:
          title: Directory Epoch
          type: integer
        file_id:
          anyOf:
          - maxLength: 26
            minLength: 26
            type: string
          - type: 'null'
          title: File Id
        reason:
          maxLength: 500
          minLength: 1
          title: Reason
          type: string
        role:
          anyOf:
          - enum:
            - admin
            - auditor
            - employee
            - operator
            type: string
          - type: 'null'
          title: Role
        suite:
          const: QG-1
          title: Suite
          type: string
        target_user_id:
          maxLength: 26
          minLength: 26
          title: Target User Id
          type: string
        type:
          enum:
          - role_grant
          - role_revoke
          - recovery_release
          title: Type
          type: string
      required:
      - directory_epoch
      - file_id
      - reason
      - role
      - suite
      - target_user_id
      - type
      title: ChangeStatement
      type: object
    Commit:
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/Manifest'
        manifest_sig:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Manifest Sig
          type: string
        recovery_wrap:
          anyOf:
          - $ref: '#/components/schemas/InnerWrap'
          - type: 'null'
          default: null
        wraps:
          items:
            $ref: '#/components/schemas/Wrap'
          maxItems: 32
          minItems: 1
          title: Wraps
          type: array
      required:
      - manifest
      - manifest_sig
      - wraps
      title: Commit
      type: object
    DeviceRename:
      additionalProperties: false
      properties:
        name:
          maxLength: 64
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: DeviceRename
      type: object
    EnrollFinish:
      additionalProperties: false
      properties:
        enroll_id:
          maxLength: 26
          minLength: 26
          title: Enroll Id
          type: string
        key_confirm:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Key Confirm
          type: string
        signature:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Signature
          type: string
      required:
      - enroll_id
      - signature
      - key_confirm
      title: EnrollFinish
      type: object
    EnrollStart:
      additionalProperties: false
      properties:
        code:
          maxLength: 64
          minLength: 10
          title: Code
          type: string
        device_name:
          maxLength: 64
          minLength: 1
          title: Device Name
          type: string
        kem_pk:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Kem Pk
          type: string
        sig_pk:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Sig Pk
          type: string
