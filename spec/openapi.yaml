            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Name
        roles:
          anyOf:
          - items:
              maxLength: 16
              type: string
            maxItems: 4
            type: array
          - type: 'null'
          default: null
          title: Roles
        user_id:
          anyOf:
          - maxLength: 26
            type: string
          - type: 'null'
          default: null
          title: User Id
      title: InviteCreate
      type: object
    Lift:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 1
          title: Reason
          type: string
      required:
      - reason
      title: Lift
      type: object
    Manifest:
      additionalProperties: false
      properties:
        chunk_count:
          title: Chunk Count
          type: integer
        ciphertext_sha256:
          maxLength: 8192
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Ciphertext Sha256
          type: string
        classification:
          enum:
          - internal
          - confidential
          - restricted
          title: Classification
          type: string
        directory_epoch:
