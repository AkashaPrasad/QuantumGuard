          type: integer
        file_id:
          maxLength: 26
          title: File Id
          type: string
        recipients:
          items:
            maxLength: 26
            minLength: 26
            type: string
          maxItems: 32
          minItems: 1
          title: Recipients
          type: array
        suite:
          const: QG-1
          title: Suite
          type: string
        version:
          title: Version
          type: integer
      required:
      - chunk_count
      - ciphertext_sha256
      - classification
      - directory_epoch
      - file_id
      - recipients
      - suite
      - version
      title: Manifest
      type: object
    MessageCreate:
      additionalProperties: false
