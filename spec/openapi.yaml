openapi: 3.1.0
paths:
  /api/v1/alerts:
    get:
      operationId: list_alerts_api_v1_alerts_get
      parameters:
      - description: Session id
        in: header
        name: QG-Session
        required: true
        schema:
          type: string
      - description: Strictly increasing sequence
        in: header
        name: QG-Seq
        required: true
        schema:
          type: string
      - description: b64u HMAC-SHA-384 over method, path, sequence, body hash
        in: header
        name: QG-MAC
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Alerts Api V1 Alerts Get
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_INVALID_INPUT, QG_BAD_SUITE, QG_BAD_SIGNATURE
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_NO_SESSION, QG_BAD_MAC, QG_REPLAY
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_DENY_REVOKED, QG_DENY_POLICY, QG_QUARANTINED, QG_LEASE_EXPIRED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_NOT_FOUND (also for objects the caller may not see)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_STALE_EPOCH, QG_CONFLICT
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_RATE_LIMITED (Retry-After is set)
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: QG_UNAVAILABLE_FAIL_CLOSED (nothing was released)
      summary: List Alerts
      tags:
      - alerts
      x-qg-gateway: true
