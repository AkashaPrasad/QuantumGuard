name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not open an issue. Follow SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, scenario names or console screens involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
