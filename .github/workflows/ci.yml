name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check commit messages
        shell: bash
        run: |
          git log --format=%B > "$RUNNER_TEMP/messages"
          if grep -Eiq 'co-authored-by:|generated with' "$RUNNER_TEMP/messages"; then
            echo 'Commit history contains prohibited attribution.' >&2
            exit 1
          fi
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, types, spec-lint, dev-test, dev-scenarios]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frozen dependencies
        run: |
          python -m pip install uv==0.9.13
          uv sync --project backend --frozen
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm --dir web install --frozen-lockfile
      - name: Run required gate
        run: make ${{ matrix.target }}
      - name: Test scanner boundary
        if: matrix.target == 'dev-test'
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Require every security fixture
        if: matrix.target == 'dev-test'
        run: uv run --project backend python -m pytest tests/security --security-strict
      - name: Upload security claims
        if: always() && matrix.target == 'dev-test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-claims
          path: claims.json
          if-no-files-found: error
  scanners:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scanner: [gitleaks, semgrep, bandit, pip-audit, pnpm-audit, trivy-fs, hadolint, banned-deps]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: scripts/scan.sh ${{ matrix.scanner }}
  stack-scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: scripts/compose.sh up --build -d --wait
      - run: scripts/scan.sh trivy-image
      - run: scripts/scan.sh zap
      - if: always()
        run: scripts/compose.sh down -v --remove-orphans
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: scripts/readme_test.sh
