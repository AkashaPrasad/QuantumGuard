[project]
name = "quantumguard"
version = "0.1.0"
description = "QuantumGuard server and qg client: post-quantum file protection with device revocation and verifiable evidence"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "typer==0.29.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
    "schemathesis==4.33.2",
]

[project.scripts]
qg = "qg.client.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, one namespace: server (backend/qg) plus the client and scenarios kept in cli/qg.
packages = ["qg"]
artifacts = ["qg/storage/schema.sql", "qg/policy/rules.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"../cli/qg/client" = "qg/client"
"../cli/qg/scenarios" = "qg/scenarios"

[tool.uv]
# Never adopt a release newer than 14 days before the build started.
exclude-newer = "2026-11-12T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["backend", "cli"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: long-running tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
# B008: FastAPI dependencies are declared as default arguments by design.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
"**/spec/vectors/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qg"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
# B404/B603: subprocess is used only with fixed argument lists of sys.executable (scenario harness starting
# the server, `qg demo seed` calling `python -m qg.admin`); no shell, no user-controlled argv.
skips = ["B404", "B603"]
